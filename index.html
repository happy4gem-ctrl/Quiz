<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智多星互動學習王 v6</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { --primary: #FF9800; --secondary: #4CAF50; --bg: #FFF9E6; --sidebar-w: 250px; }
        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 左側邊欄 */
        #sidebar { width: var(--sidebar-w); background: #333; color: white; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; transition: 0.3s; }
        #sidebar h2 { font-size: 18px; color: #FFD54F; text-align: center; margin-top: 0; }
        .history-item { background: #444; padding: 10px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; font-size: 14px; }
        .history-item:hover { background: #555; border-left-color: var(--primary); }
        .history-item.active { background: #555; border-left-color: var(--secondary); }
        .del-btn { float: right; color: #ff6b6b; cursor: pointer; font-weight: bold; }

        /* 右側主內容 */
        #main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* 輸入與控制區 (學生模式會隱藏) */
        .teacher-only { border: 2px dashed #ddd; padding: 15px; border-radius: 10px; margin-bottom: 20px; background: #fafafa; }
        h1 { text-align: center; color: #E67E22; margin-top: 0; }
        
        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; margin-top: 5px; color: white; }
        .btn-gen { background: var(--primary); }
        .btn-share { background: #2196F3; margin-top: 15px; }
        .btn-retry { background: #607D8B; width: auto; padding: 8px 20px; display: none; margin: 0 auto; }

        /* 測驗區 */
        .q-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .opt-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #f0f0f0; border-radius: 50px; background: white; text-align: left; cursor: pointer; transition: 0.2s; }
        .opt-btn:hover { background: #fdfdfd; border-color: #ccc; }
        .correct { background: var(--secondary) !important; color: white; border-color: var(--secondary); }
        .wrong { background: #F44336 !important; color: white; border-color: #F44336; }

        /* 分享彈窗 */
        #shareModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        
        /* 學生模式樣式調整 */
        body.student-mode #sidebar { display: none; } /* 學生看不到歷史記錄 */
        body.student-mode .teacher-only { display: none; } /* 學生看不到輸入框 */
        body.student-mode .container { max-width: 600px; border: 4px solid #4CAF50; }
        body.student-mode .btn-share { display: none; }
        body.student-mode .btn-retry { display: block; } /* 顯示重做按鈕 */
    </style>
</head>
<body>

<aside id="sidebar">
    <h2>📂 題庫歷史</h2>
    <div id="historyList">
        </div>
    <div style="margin-top: auto; font-size: 12px; color: #888; text-align: center;">
        題目保存在你的電腦中
    </div>
</aside>

<main id="main-content">
    <div class="container">
        <h1 id="appTitle">🐼 智多星互動學習王</h1>
        
        <div class="teacher-only">
            <label>🔑 API Key</label>
            <input type="password" id="apiKey" placeholder="輸入 API Key">
            
            <label>📖 1. 課文原文</label>
            <textarea id="inputText" style="height: 100px;" placeholder="貼上課文..."></textarea>
            
            <label>📝 2. 自定義題目 (可選)</label>
            <textarea id="customQuizzes" style="height: 80px;" placeholder="1. 問題 答案：xxx..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="qCount" style="width: 30%;">
                    <option value="3">3 題</option>
                    <option value="5" selected>5 題</option>
                    <option value="10">10 題</option>
                    <option value="全部">盡量出（全部）</option>
                </select>
                <button class="btn-gen" onclick="generateQuiz()" id="genBtn">🚀 生成題目</button>
            </div>
            <div id="loading" style="display:none; text-align:center; color:#E67E22; margin-top:10px;">AI 正在出題中... ⏳</div>
        </div>

        <div id="quizArea" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0; color: #333;">🧠 挑戰小測試</h2>
                <button class="btn-retry" onclick="renderQuiz(currentQuizData)">🔄 重做一次</button>
            </div>
            <div id="quizContent"></div>
            
            <button class="btn-share" onclick="showShareModal()">🔗 生成學生連結 / QR Code</button>
        </div>
    </div>
</main>

<div id="shareModal">
    <div class="modal-content">
        <h3>📲 分享給學生</h3>
        <p>學生掃碼或點擊連結即可直接做題！</p>
        <div id="qrcode"></div>
        <input type="text" id="shareLink" readonly onclick="this.select()" style="text-align: center; background: #f0f0f0;">
        <button onclick="document.getElementById('shareModal').style.display='none'" style="background: #ccc; margin-top: 10px; color: #333;">關閉</button>
    </div>
</div>

<script>
let currentQuizData = []; // 存儲當前題目
let historyData = JSON.parse(localStorage.getItem('quizHistory')) || [];

// 初始化：檢查是否是學生模式 (網址有無 ?data=...)
window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const compressedData = params.get('data');

    if (compressedData) {
        // --- 學生模式 ---
        document.body.classList.add('student-mode');
        document.getElementById('appTitle').innerText = "📝 同學，請開始挑戰！";
        try {
            // 解壓數據
            const jsonStr = LZString.decompressFromEncodedURIComponent(compressedData);
            const data = JSON.parse(jsonStr);
            currentQuizData = data;
            document.getElementById('quizArea').style.display = 'block';
            renderQuiz(data);
        } catch (e) {
            alert("連結無效或數據損壞！");
        }
    } else {
        // --- 老師模式 ---
        renderHistory(); // 載入左側歷史
    }
};

async function generateQuiz() {
    const key = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('inputText').value.trim();
    const customText = document.getElementById('customQuizzes').value.trim();
    const count = document.getElementById('qCount').value;

    if (!key) return alert("請輸入 API Key！");
    if (!text && !customText) return alert("請輸入課文或自定義題目！");

    document.getElementById('loading').style.display = 'block';
    document.getElementById('genBtn').disabled = true;

    let prompt = "";
    if(customText) {
        prompt = `參考內容："${text}"\n將以下題目轉為JSON並補齊干擾項，隨機打亂ans位置(0-3)：\n${customText}\n格式：{ "quizzes": [ { "q": "...", "options": ["A","B","C","D"], "ans": 0 } ] }`;
    } else {
        prompt = `根據內容："${text}"\n生成 ${count} 條選擇題。隨機打亂ans位置(0-3)。格式：{ "quizzes": [ { "q": "...", "options": ["A","B","C","D"], "ans": 0 } ] }`;
    }

    try {
        const res = await fetch('https://api.chatanywhere.tech/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }] })
        });
        
        const data = await res.json();
        const jsonMatch = data.choices[0].message.content.match(/\{[\s\S]*\}/);
        if(jsonMatch) {
            const result = JSON.parse(jsonMatch[0]);
            currentQuizData = result.quizzes;
            
            // 1. 顯示題目
            document.getElementById('quizArea').style.display = 'block';
            renderQuiz(currentQuizData);
            
            // 2. 存入歷史
            saveToHistory(text || customText, currentQuizData);
        }
    } catch (e) {
        alert("生成失敗，請重試");
        console.error(e);
    } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('genBtn').disabled = false;
    }
}

function renderQuiz(quizzes) {
    const container = document.getElementById('quizContent');
    container.innerHTML = "";
    quizzes.forEach((item, qIdx) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML = `<p><strong>Q${qIdx+1}. ${item.q}</strong></p>`;
        
        item.options.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                const btns = card.querySelectorAll('.opt-btn');
                btns.forEach(b => b.style.pointerEvents = 'none');
                if(oIdx === parseInt(item.ans)) {
                    btn.classList.add('correct');
                    btn.innerText += " ✅";
                } else {
                    btn.classList.add('wrong');
                    btn.innerText += " ❌";
                    btns[parseInt(item.ans)].classList.add('correct');
                }
            };
            card.appendChild(btn);
        });
        container.appendChild(card);
    });
}

// --- 歷史記錄功能 ---
function saveToHistory(title, quizData) {
    const shortTitle = title.substring(0, 15) + (title.length>15 ? "..." : "");
    const newItem = {
        id: Date.now(),
        title: shortTitle,
        date: new Date().toLocaleDateString(),
        data: quizData
    };
    historyData.unshift(newItem); // 加到最前面
    localStorage.setItem('quizHistory', JSON.stringify(historyData));
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = "";
    historyData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
            <div>${item.title}</div>
            <div style="font-size:12px; color:#aaa;">${item.date}</div>
            <span class="del-btn" onclick="deleteHistory(event, ${index})">×</span>
        `;
        div.onclick = (e) => {
            if(e.target.className !== 'del-btn') {
                currentQuizData = item.data;
                document.getElementById('quizArea').style.display = 'block';
                renderQuiz(item.data);
                // 標記選中
                document.querySelectorAll('.history-item').forEach(i=>i.classList.remove('active'));
                div.classList.add('active');
            }
        };
        list.appendChild(div);
    });
}

function deleteHistory(e, index) {
    e.stopPropagation();
    if(confirm("確定刪除這個記錄嗎？")) {
        historyData.splice(index, 1);
        localStorage.setItem('quizHistory', JSON.stringify(historyData));
        renderHistory();
    }
}

// --- 分享功能 ---
function showShareModal() {
    if(!currentQuizData || currentQuizData.length === 0) return alert("沒有題目可以分享！");

    // 1. 壓縮數據
    const jsonStr = JSON.stringify(currentQuizData);
    const compressed = LZString.compressToEncodedURIComponent(jsonStr);
    
    // 2. 生成連結 (當前網址 + ?data=...)
    // 注意：如果是 Vercel，它會自動變成你的 Vercel 網址
    const baseUrl = window.location.href.split('?')[0];
    const fullLink = `${baseUrl}?data=${compressed}`;
    
    // 3. 顯示 Link
    const linkInput = document.getElementById('shareLink');
    linkInput.value = fullLink;
    
    // 4. 生成 QR Code
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
        text: fullLink,
        width: 150,
        height: 150
    });
    
    document.getElementById('shareModal').style.display = 'flex';
}
</script>
</body>
</html>
