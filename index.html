<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學互動學習王 v7 (修復版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #FF9800; --secondary: #4CAF50; --bg: #FFF9E6; --sidebar-w: 250px; }
        body { font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif; background-color: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* 左側邊欄 */
        #sidebar { width: var(--sidebar-w); background: #333; color: white; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        #sidebar h2 { font-size: 18px; color: #FFD54F; text-align: center; margin-top: 0; }
        .history-item { background: #444; padding: 10px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; font-size: 14px; position: relative; }
        .history-item:hover { background: #555; border-left-color: var(--primary); }
        .history-item.active { background: #555; border-left-color: var(--secondary); }
        .del-btn { position: absolute; right: 10px; top: 10px; color: #ff6b6b; cursor: pointer; font-weight: bold; padding: 0 5px; }

        /* 右側主內容 */
        #main-content { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* 輸入與控制區 */
        .teacher-only { border: 2px dashed #ddd; padding: 15px; border-radius: 10px; margin-bottom: 20px; background: #fafafa; }
        h1 { text-align: center; color: #E67E22; margin-top: 0; }
        
        input, textarea, select { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; margin-top: 5px; color: white; }
        .btn-gen { background: var(--primary); }
        .btn-share { background: #2196F3; margin-top: 15px; }
        .btn-retry { background: #607D8B; width: auto; padding: 8px 20px; display: none; margin: 0 auto; }

        /* 測驗區 */
        .q-card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .opt-btn { display: block; width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #f0f0f0; border-radius: 50px; background: white; text-align: left; cursor: pointer; transition: 0.2s; color: #333; }
        .opt-btn:hover { background: #fdfdfd; border-color: #ccc; }
        
        /* 強制顏色樣式 (避免被瀏覽器預設樣式覆蓋) */
        .correct-ans { background-color: #4CAF50 !important; color: white !important; border-color: #4CAF50 !important; }
        .wrong-ans { background-color: #F44336 !important; color: white !important; border-color: #F44336 !important; }

        /* 分享彈窗 */
        #shareModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; width: 90%; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; min-height: 150px; align-items: center; }
        
        /* 學生模式 */
        body.student-mode #sidebar { display: none; }
        body.student-mode .teacher-only { display: none; }
        body.student-mode .container { max-width: 600px; border: 4px solid #4CAF50; }
        body.student-mode .btn-share { display: none; }
        body.student-mode .btn-retry { display: block; }
    </style>
</head>
<body>

<aside id="sidebar">
    <h2>📂 題庫歷史</h2>
    <div id="historyList"></div>
    <div style="margin-top: auto; padding: 10px; font-size: 12px; color: #aaa; text-align: center;">
        記錄存在本機瀏覽器
    </div>
</aside>

<main id="main-content">
    <div class="container">
        <h1 id="appTitle">🐼 智多星互動學習王</h1>
        
        <div class="teacher-only">
            <label>🔑 API Key</label>
            <input type="password" id="apiKey" placeholder="輸入 API Key">
            
            <label>📖 1. 課文原文</label>
            <textarea id="inputText" style="height: 100px;" placeholder="貼上課文..."></textarea>
            
            <label>📝 2. 自定義題目 (可選)</label>
            <textarea id="customQuizzes" style="height: 80px;" placeholder="1. 問題 答案：xxx..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="qCount" style="width: 30%;">
                    <option value="3">3 題</option>
                    <option value="5" selected>5 題</option>
                    <option value="10">10 題</option>
                    <option value="20">20 題</option>
                    <option value="全部">盡量出（全部）</option>
                </select>
                <button class="btn-gen" onclick="generateQuiz()" id="genBtn">🚀 生成題目</button>
            </div>
            <div id="loading" style="display:none; text-align:center; color:#E67E22; margin-top:10px;">AI 正在出題中... ⏳</div>
        </div>

        <div id="quizArea" style="display:none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin:0; color: #333;">🧠 挑戰小測試</h2>
                <button class="btn-retry" onclick="resetQuiz()">🔄 重做一次</button>
            </div>
            <div id="quizContent"></div>
            <button class="btn-share" onclick="showShareModal()">🔗 生成學生連結 / QR Code</button>
        </div>
    </div>
</main>

<div id="shareModal">
    <div class="modal-content">
        <h3>📲 分享給學生</h3>
        <p>掃描 QR Code 或複製連結</p>
        <div id="qrcode"></div>
        <input type="text" id="shareLink" readonly onclick="this.select()" style="text-align: center; background: #f0f0f0; font-size: 12px; color: #555;">
        <button onclick="document.getElementById('shareModal').style.display='none'" style="background: #ccc; margin-top: 10px; color: #333;">關閉</button>
    </div>
</div>

<script>
// 全局變量
let currentQuizData = [];
let historyData = [];

// 初始化
window.onload = function() {
    try {
        historyData = JSON.parse(localStorage.getItem('quizHistory')) || [];
        
        const params = new URLSearchParams(window.location.search);
        const compressedData = params.get('data');

        if (compressedData) {
            // 學生模式
            if (typeof LZString === 'undefined') {
                throw new Error("外掛程式 LZString 載入失敗，請檢查網絡");
            }
            document.body.classList.add('student-mode');
            document.getElementById('appTitle').innerText = "📝 同學，請開始挑戰！";
            
            const jsonStr = LZString.decompressFromEncodedURIComponent(compressedData);
            if(!jsonStr) throw new Error("數據解壓縮失敗");
            
            const data = JSON.parse(jsonStr);
            currentQuizData = data;
            document.getElementById('quizArea').style.display = 'block';
            renderQuiz(data);
        } else {
            // 老師模式
            renderHistory();
        }
    } catch (e) {
        alert("初始化錯誤：" + e.message);
    }
};

// 捕捉全域錯誤 (Debug 用)
window.onerror = function(message, source, lineno, colno, error) {
    console.error("JS Error:", message);
    // 如果按鈕沒反應，這個 alert 會告訴原因
    // alert("系統偵測到錯誤: " + message); 
};

async function generateQuiz() {
    const key = document.getElementById('apiKey').value.trim();
    const text = document.getElementById('inputText').value.trim();
    const customText = document.getElementById('customQuizzes').value.trim();
    const count = document.getElementById('qCount').value;

    if (!key) return alert("請輸入 API Key！");
    if (!text && !customText) return alert("請輸入課文或自定義題目！");

    document.getElementById('loading').style.display = 'block';
    document.getElementById('genBtn').disabled = true;

    // Prompt 優化
    let prompt = "";
    const baseReq = `回傳純JSON格式: { "quizzes": [ { "q": "題目", "options": ["A","B","C","D"], "ans": 0 } ] }。注意：ans必須是0-3的數字。`;
    
    if(customText) {
        prompt = `參考內容："${text}"。請將以下題目轉為JSON並補齊選項，要求：
            1. 必須嚴格遵守老師的問題和正確答案。
            2. 為每題補齊另外 3 個干擾選項，總共 4 個選項，每個選項有25%為正確答案。
            3. 正確答案隨機位置  (ans)。隨機打亂ans位置：\n${customText}\n${baseReq}`;
    } else {
        prompt = `根據內容："${text}"。生成 ${count} 要求：
            1. 必須嚴格遵守老師的問題和正確答案。
            2. 為每題補齊另外 3 個干擾選項，總共 4 個選項，每個選項有25%為正確答案。
            3. 正確答案隨機位置 (ans)。。\n${baseReq}`;
    }

    try {
        const res = await fetch('https://api.chatanywhere.tech/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }] })
        });
        
        const data = await res.json();
        const content = data.choices[0].message.content;
        
        // 嘗試解析 JSON (處理可能存在的 Markdown 符號)
        const jsonMatch = content.match(/\{[\s\S]*\}/);
        if(jsonMatch) {
            const result = JSON.parse(jsonMatch[0]);
            currentQuizData = result.quizzes;
            
            document.getElementById('quizArea').style.display = 'block';
            renderQuiz(currentQuizData);
            saveToHistory(text || customText, currentQuizData);
        } else {
            throw new Error("AI 回傳格式不正確");
        }
    } catch (e) {
        alert("生成失敗：" + e.message);
    } finally {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('genBtn').disabled = false;
    }
}

function renderQuiz(quizzes) {
    const container = document.getElementById('quizContent');
    container.innerHTML = "";
    
    quizzes.forEach((item, qIdx) => {
        const card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML = `<p><strong>Q${qIdx+1}. ${item.q}</strong></p>`;
        
        item.options.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerText = opt; // 確保按鈕有文字
            
            // 綁定點擊事件
            btn.onclick = function() {
                // 1. 禁用該題所有按鈕
                const btns = card.querySelectorAll('.opt-btn');
                btns.forEach(b => b.style.pointerEvents = 'none');
                
                // 2. 獲取正確答案 (寬鬆比較，防止 string/number 問題)
                const correctIdx = item.ans; 
                
                // 3. 判斷對錯
                if(oIdx == correctIdx) {
                    btn.classList.add('correct-ans');
                    btn.innerHTML += " ✅";
                } else {
                    btn.classList.add('wrong-ans');
                    btn.innerHTML += " ❌";
                    // 顯示正確答案
                    if(btns[correctIdx]) {
                        btns[correctIdx].classList.add('correct-ans');
                        btns[correctIdx].innerHTML += " 👈";
                    }
                }
            };
            card.appendChild(btn);
        });
        container.appendChild(card);
    });
}

function resetQuiz() {
    renderQuiz(currentQuizData);
}

// --- 歷史記錄 ---
function saveToHistory(title, quizData) {
    const shortTitle = (title.substring(0, 10) || "未命名") + "...";
    const newItem = { id: Date.now(), title: shortTitle, date: new Date().toLocaleDateString(), data: quizData };
    historyData.unshift(newItem);
    localStorage.setItem('quizHistory', JSON.stringify(historyData));
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('historyList');
    list.innerHTML = "";
    historyData.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        // 如果這個項目是當前顯示的，加上 active
        if(JSON.stringify(currentQuizData) === JSON.stringify(item.data)) {
            div.classList.add('active');
        }
        
        div.innerHTML = `
            <div>${item.title}</div>
            <div style="font-size:12px; color:#aaa;">${item.date}</div>
            <span class="del-btn">×</span>
        `;
        
        // 點擊載入
        div.onclick = (e) => {
            currentQuizData = item.data;
            document.getElementById('quizArea').style.display = 'block';
            renderQuiz(item.data);
            renderHistory(); // 重新渲染以更新 active 狀態
        };
        
        // 點擊刪除
        div.querySelector('.del-btn').onclick = (e) => {
            e.stopPropagation();
            if(confirm("刪除此記錄？")) {
                historyData.splice(index, 1);
                localStorage.setItem('quizHistory', JSON.stringify(historyData));
                renderHistory();
            }
        };
        
        list.appendChild(div);
    });
}

// --- 分享功能 (具備縮短網址功能) ---
async function showShareModal() {
    if(!currentQuizData || currentQuizData.length === 0) return alert("請先生成題目！");

    const modal = document.getElementById('shareModal');
    const qrContainer = document.getElementById('qrcode');
    const linkInput = document.getElementById('shareLink');
    
    modal.style.display = 'flex';
    qrContainer.innerHTML = "正在生成二維碼...";
    linkInput.value = "正在縮短網址...";

    try {
        // 1. 原始壓縮邏輯
        const jsonStr = JSON.stringify(currentQuizData);
        const compressed = LZString.compressToEncodedURIComponent(jsonStr);
        const baseUrl = window.location.href.split('?')[0];
        const longLink = `${baseUrl}?data=${compressed}`;

        // 2. 呼叫 TinyURL API 縮短連結
        let finalLink = longLink;
        try {
            // 使用 TinyURL 的公開 API
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longLink)}`);
            if (response.ok) {
                finalLink = await response.text(); // 獲取縮短後的網址
            }
        } catch (shortError) {
            console.warn("網址縮短失敗，使用原始長連結", shortError);
            // 失敗時保持長連結，確保功能不中斷
        }

        linkInput.value = finalLink;

        // 3. 生成 QR Code (使用縮短後的連結，掃描會更靈敏)
        qrContainer.innerHTML = ""; 
        new QRCode(qrContainer, {
            text: finalLink,
            width: 180,
            height: 180,
            correctLevel : QRCode.CorrectLevel.H // 因為連結變短了，可以提高容錯率
        });
        
    } catch (e) {
        alert("分享失敗: " + e.message);
        linkInput.value = "生成失敗";
    }
}
</script>
</body>
</html>
