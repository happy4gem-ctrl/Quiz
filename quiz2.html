<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學手動出題介面</title>
    <!-- 引入 QR Code 生成套件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        /* 按鈕樣式 */
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; color: white; width: 100%; font-size: 18px; margin-top: 10px; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .btn-danger:hover { background-color: #c0392b; }
        
        /* 預覽與卡片 */
        .question-card { background: #f9f9f9; padding: 20px; border-left: 5px solid #3498db; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .history-item { background: #ecf0f1; padding: 12px 15px; margin-bottom: 8px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .history-actions { display: flex; gap: 5px; }

        /* 🧠 挑戰小測試：互動選項按鈕 */
        .option-btn { display: block; width: 100%; text-align: left; padding: 12px 15px; margin: 8px 0; background: #fff; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
        .option-btn:hover { background: #f0f4f8; border-color: #3498db; }
        .option-btn:disabled { cursor: not-allowed; }
        
        /* 答題回饋顏色 */
        .option-btn.correct { background: #d4edda !important; border-color: #28a745 !important; color: #155724; font-weight: bold; }
        .option-btn.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; }
        
        /* 計分板 */
        #score-board { background: #e8f4fd; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px; border: 1px solid #bee5eb; color: #0c5460; }

        /* Modal 彈窗 */
        #qr-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 1000; text-align: center; width: 90%; max-width: 400px; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        
        #student-view { display: none; }
    </style>
</head>
<body>

<!-- 老師端出題畫面 -->
<div class="container" id="teacher-view">
    <h1>🐼 小學手動出題工具 </h1>

    <!-- 手動出題表單 -->
    <div>
        <h2>📝 1. 手動新增選擇題</h2>
        <div class="form-group">
            <label>題目內容：</label>
            <textarea id="q-text" rows="3" placeholder="請輸入題目問題..."></textarea>
        </div>
        <div class="form-group">
            <label>選項 A：</label><input type="text" id="opt-a" placeholder="輸入選項 A 內容">
        </div>
        <div class="form-group">
            <label>選項 B：</label><input type="text" id="opt-b" placeholder="輸入選項 B 內容">
        </div>
        <div class="form-group">
            <label>選項 C：（選填）</label><input type="text" id="opt-c" placeholder="輸入選項 C 內容">
        </div>
        <div class="form-group">
            <label>選項 D：（選填）</label><input type="text" id="opt-d" placeholder="輸入選項 D 內容">
        </div>
        <div class="form-group">
            <label>正確答案：</label>
            <select id="correct-ans">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="addQuestion()">➕ 加入此題</button>
    </div>

    <!-- 題目清單預覽 -->
    <div style="margin-top: 30px;">
        <h2>📋 2. 目前題庫預覽 (共 <span id="q-count">0</span> 題)</h2>
        <div id="questions-list"></div>
        <button class="btn btn-success" onclick="generateShareLink()">🔗 儲存並生成學生連結 / QR Code</button>
    </div>

    <!-- 歷史紀錄 -->
    <div style="margin-top: 30px;">
        <h2>📂 3. 歷史出題紀錄</h2>
        <div id="history-list"></div>
    </div>
</div>

<!-- 學生端測驗畫面 -->
<div class="container" id="student-view">
    <h1>🐼 智多星互動學習王</h1>
    <h2>🧠 挑戰小測試</h2>
    
    <!-- 動態計分板 -->
    <div id="score-board">
        📝 答題進度：<span id="answered-count">0</span> / <span id="total-count">0</span> 題 
        | 🎯 目前得分：<span id="current-score">0</span> 分
    </div>
    
    <div id="quiz-container"></div>
</div>

<!-- QR Code 與縮網址彈出視窗 -->
<div id="overlay" onclick="closeModal()"></div>
<div id="qr-modal">
    <h3>📲 分享給學生</h3>
    <p>掃描 QR Code 或複製縮短的連結：</p>
    <div id="qrcode"></div>
    <input type="text" id="short-link" readonly style="width:100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
    <button class="btn btn-primary" onclick="copyLink()">複製連結</button>
    <button class="btn" style="background:#bdc3c7;" onclick="closeModal()">關閉</button>
</div>

<script>
    let questions = [];
    let studentScore = 0;
    let answeredQuestions = 0;

    // 初始化檢測
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');

        if (encodedData) {
            // 切換至學生互動答題畫面
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
            loadStudentQuiz(encodedData);
        } else {
            // 老師畫面：渲染歷史紀錄
            renderHistory();
        }
    }

    // 新增題目到列表
    function addQuestion() {
        const qText = document.getElementById('q-text').value.trim();
        const optA = document.getElementById('opt-a').value.trim();
        const optB = document.getElementById('opt-b').value.trim();
        const optC = document.getElementById('opt-c').value.trim();
        const optD = document.getElementById('opt-d').value.trim();
        const correctAns = document.getElementById('correct-ans').value;

        if (!qText || !optA || !optB) {
            alert("請至少輸入題目以及 A、B 兩個選項！");
            return;
        }

        const questionObj = {
            id: Date.now(),
            question: qText,
            options: { A: optA, B: optB, C: optC, D: optD },
            answer: correctAns
        };

        questions.push(questionObj);
        renderQuestions();
        clearForm();
    }

    function clearForm() {
        document.getElementById('q-text').value = '';
        document.getElementById('opt-a').value = '';
        document.getElementById('opt-b').value = '';
        document.getElementById('opt-c').value = '';
        document.getElementById('opt-d').value = '';
        document.getElementById('correct-ans').value = 'A';
    }

    // 老師端渲染目前新增的題目
    function renderQuestions() {
        const listDiv = document.getElementById('questions-list');
        listDiv.innerHTML = '';
        document.getElementById('q-count').innerText = questions.length;

        questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question-card';
            
            let optionsText = `A) ${q.options.A} | B) ${q.options.B}`;
            if(q.options.C) optionsText += ` | C) ${q.options.C}`;
            if(q.options.D) optionsText += ` | D) ${q.options.D}`;

            div.innerHTML = `
                <strong>Q${index + 1}: ${q.question}</strong><br>
                <small style="color:#7f8c8d;">${optionsText}</small><br>
                <span style="color: #2ecc71; font-weight: bold;">設定答案：${q.answer}</span>
                <button class="btn-danger" style="float: right;" onclick="removeQuestion(${q.id})">刪除</button>
                <div style="clear: both;"></div>
            `;
            listDiv.appendChild(div);
        });
    }

    function removeQuestion(id) {
        questions = questions.filter(q => q.id !== id);
        renderQuestions();
    }

    // 生成分享連結、縮網址與儲存歷史紀錄
    async function generateShareLink() {
        if (questions.length === 0) {
            alert("請先新增至少一道題目！");
            return;
        }

        // 儲存至本機歷史紀錄 (LocalStorage)
        const quizRecord = {
            id: 'quiz_' + Date.now(),
            time: new Date().toLocaleString(),
            title: questions[0].question.substring(0, 15) + "...", // 用第一題前幾個字當辨識標題
            data: questions
        };
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        history.push(quizRecord);
        localStorage.setItem('quizHistory', JSON.stringify(history));
        renderHistory();

        // 資料打包轉 Base64
        const jsonData = JSON.stringify(questions);
        const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonData))));
        
        const baseUrl = window.location.origin + window.location.pathname;
        const longUrl = `${baseUrl}?data=${encodedData}`;

        showModal("正在產生縮網址... ⏳");

        try {
            // 調用 TinyURL 縮網址 API
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
            if (response.ok) {
                const shortUrl = await response.text();
                document.getElementById('short-link').value = shortUrl;
                renderQRCode(shortUrl);
            } else {
                throw new Error();
            }
        } catch (error) {
            // 備用方案：若縮網址 API 失敗則直接用長網址
            document.getElementById('short-link').value = longUrl;
            renderQRCode(longUrl);
        }
    }

    function renderQRCode(url) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = ''; 
        new QRCode(qrContainer, {
            text: url,
            width: 180,
            height: 180
        });
    }

    // 處理歷史紀錄區域
    function renderHistory() {
        const historyDiv = document.getElementById('history-list');
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];

        if (history.length === 0) {
            historyDiv.innerHTML = '<p style="color:#7f8c8d; text-align:center;">目前沒有歷史出題紀錄</p>';
            return;
        }

        historyDiv.innerHTML = '';
        // 由新到舊排序顯示
        history.reverse().forEach(record => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <div>
                    <strong>📅 ${record.time}</strong> <br>
                    <small style="color: #555;">摘要: ${record.title} (共 ${record.data.length} 題)</small>
                </div>
                <div class="history-actions">
                    <button class="btn btn-primary" style="padding: 5px 10px; font-size: 13px;" onclick="loadHistory('${record.id}')">載入題庫</button>
                    <button class="btn-danger" style="padding: 5px 10px; font-size: 13px;" onclick="deleteHistory('${record.id}')">刪除</button>
                </div>
            `;
            historyDiv.appendChild(item);
        });
    }

    function loadHistory(recordId) {
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        const record = history.find(h => h.id === recordId);
        if (record) {
            questions = record.data;
            renderQuestions();
            alert("題庫已成功載入！您可以繼續加題或直接重新生成連結。");
        }
    }

    function deleteHistory(recordId) {
        if(!confirm("確定要刪除這筆歷史紀錄嗎？")) return;
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        history = history.filter(h => h.id !== recordId);
        localStorage.setItem('quizHistory', JSON.stringify(history));
        renderHistory();
    }

    // 🧠 學生端：解析並載入互動式「挑戰小測試」
    function loadStudentQuiz(encodedData) {
        try {
            const jsonString = decodeURIComponent(escape(atob(decodeURIComponent(encodedData))));
            const studentQuestions = JSON.parse(jsonString);
            
            answeredQuestions = 0;
            studentScore = 0;
            const perQuestionScore = Math.round(100 / studentQuestions.length);

            document.getElementById('total-count').innerText = studentQuestions.length;
            document.getElementById('answered-count').innerText = 0;
            document.getElementById('current-score').innerText = 0;

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            studentQuestions.forEach((q, qIndex) => {
                const qCard = document.createElement('div');
                qCard.className = 'question-card';
                qCard.id = `q-block-${qIndex}`;
                
                // 題目文字
                let htmlContent = `<h3>Q${qIndex + 1}. ${q.question}</h3>`;
                
                // 產生可點擊的互動選項按鈕
                ['A', 'B', 'C', 'D'].forEach(optionKey => {
                    const optionText = q.options[optionKey];
                    if (optionText) { // 確保該選項有文字才渲染
                        htmlContent += `
                            <button class="option-btn q-${qIndex}-opt" data-option="${optionKey}" onclick="selectAnswer(${qIndex}, '${optionKey}', '${q.answer}', ${perQuestionScore})">
                                <strong>${optionKey}.</strong> ${optionText}
                            </button>
                        `;
                    }
                });
                
                qCard.innerHTML = htmlContent;
                container.appendChild(qCard);
            });

        } catch (e) {
            document.getElementById('quiz-container').innerHTML = "<p style='color:red; font-weight:bold; text-align:center;'>⚠️ 連結無效或資料損毀，請向老師重新索取連結。</p>";
        }
    }

    // 學生點擊選項時的互動核心邏輯
    function selectAnswer(qIndex, selectedOption, correctOption, scorePerQuestion) {
        const buttons = document.querySelectorAll(`.q-${qIndex}-opt`);
        
        // 1. 凍結該題所有按鈕，不允許重複點擊
        buttons.forEach(btn => btn.disabled = true);
        
        // 2. 判斷對錯並著色
        buttons.forEach(btn => {
            const opt = btn.getAttribute('data-option');
            if (opt === correctOption) {
                // 正確答案一律顯示綠色
                btn.classList.add('correct');
            }
            if (opt === selectedOption && selectedOption !== correctOption) {
                // 如果選錯了，選錯的那個顯示紅色
                btn.classList.add('wrong');
            }
        });

        // 3. 答對加分邏輯
        if (selectedOption === correctOption) {
            studentScore += scorePerQuestion;
        }
        
        // 4. 更新上方動態計分板
        answeredQuestions++;
        const totalQuestions = parseInt(document.getElementById('total-count').innerText);
        
        // 防止最後一題因為四捨五入不滿或超過 100 分
        if (answeredQuestions === totalQuestions && studentScore > 0) {
            // 如果全對，直接校正為 100 分
            const allCorrect = Array.from(document.querySelectorAll('.option-btn.wrong')).length === 0;
            if (allCorrect) studentScore = 100;
        }

        document.getElementById('answered-count').innerText = answeredQuestions;
        document.getElementById('current-score').innerText = studentScore;

        // 全數答完跳出完成提示
        if(answeredQuestions === totalQuestions) {
            setTimeout(() => {
                alert(`🎉 恭喜完成測試！你的最終得分是：${studentScore} 分！`);
            }, 500);
        }
    }

    // Modal 視窗控制
    function showModal(initialText) {
        document.getElementById('short-link').value = initialText || "";
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('qr-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('qr-modal').style.display = 'none';
    }

    function copyLink() {
        const linkInput = document.getElementById('short-link');
        linkInput.select();
        document.execCommand("copy");
        alert("✅ 連結已複製！可以貼給學生測試了。");
    }
</script>
</body>

<script>
    let questions = [];

    // 初始化：檢查是否為「學生測驗模式」（網址內有 ?data= 參數）
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');

        if (encodedData) {
            // 切換到學生畫面
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
            loadStudentQuiz(encodedData);
        } else {
            // 老師出題畫面：載入歷史紀錄
            renderHistory();
        }
    }

    // 1. 新增題目到清單
    function addQuestion() {
        const qText = document.getElementById('q-text').value.trim();
        const optA = document.getElementById('opt-a').value.trim();
        const optB = document.getElementById('opt-b').value.trim();
        const optC = document.getElementById('opt-c').value.trim();
        const optD = document.getElementById('opt-d').value.trim();
        const correctAns = document.getElementById('correct-ans').value;

        if (!qText || !optA || !optB) {
            alert("請至少輸入題目及選項A、選項B！");
            return;
        }

        const questionObj = {
            id: Date.now(),
            question: qText,
            options: { A: optA, B: optB, C: optC, D: optD },
            answer: correctAns
        };

        questions.push(questionObj);
        renderQuestions();
        clearForm();
    }

    // 清空輸入表單
    function clearForm() {
        document.getElementById('q-text').value = '';
        document.getElementById('opt-a').value = '';
        document.getElementById('opt-b').value = '';
        document.getElementById('opt-c').value = '';
        document.getElementById('opt-d').value = '';
        document.getElementById('correct-ans').value = 'A';
    }

    // 渲染目前的題目清單
    function renderQuestions() {
        const listDiv = document.getElementById('questions-list');
        listDiv.innerHTML = '';
        document.getElementById('q-count').innerText = questions.length;

        questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question-card';
            div.innerHTML = `
                <strong>Q${index + 1}: ${q.question}</strong><br>
                A) ${q.options.A} | B) ${q.options.B} | C) ${q.options.C} | D) ${q.options.D}<br>
                <span style="color: #e74c3c; font-weight: bold;">解答：${q.answer}</span>
                <button class="btn-danger" style="float: right;" onclick="removeQuestion(${q.id})">刪除</button>
                <div style="clear: both;"></div>
            `;
            listDiv.appendChild(div);
        });
    }

    // 刪除題目
    function removeQuestion(id) {
        questions = questions.filter(q => q.id !== id);
        renderQuestions();
    }

    // 2. 儲存題庫、生成連結與縮網址
    async function generateShareLink() {
        if (questions.length === 0) {
            alert("請至少輸入一題題目後再生成連結！");
            return;
        }

        // 儲存到 localStorage 歷史紀錄
        const quizRecord = {
            id: 'quiz_' + Date.now(),
            time: new Date().toLocaleString(),
            data: questions
        };
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        history.push(quizRecord);
        localStorage.setItem('quizHistory', JSON.stringify(history));
        renderHistory();

        // 將題目資料轉為 Base64 (可放進網址內)
        const jsonData = JSON.stringify(questions);
        const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonData))));
        
        // 取得目前的網址路徑
        const baseUrl = window.location.origin + window.location.pathname;
        const longUrl = `${baseUrl}?data=${encodedData}`;

        showModal("縮網址生成中... ⏳");

        try {
            // 使用 TinyURL API 縮短連結 (避免 Base64 網址太長)
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
            if (response.ok) {
                const shortUrl = await response.text();
                document.getElementById('short-link').value = shortUrl;
                renderQRCode(shortUrl);
            } else {
                throw new Error("縮網址 API 錯誤");
            }
        } catch (error) {
            console.error(error);
            // 萬一縮網址失敗，就退回使用長網址
            document.getElementById('short-link').value = longUrl;
            renderQRCode(longUrl);
        }
    }

    // 生成 QR Code
    function renderQRCode(url) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = ''; 
        new QRCode(qrContainer, {
            text: url,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff"
        });
    }

    // 彈出視窗與複製連結
    function showModal(initialText) {
        document.getElementById('short-link').value = initialText || "";
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('qr-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('qr-modal').style.display = 'none';
    }

    function copyLink() {
        const linkInput = document.getElementById('short-link');
        linkInput.select();
        document.execCommand("copy");
        alert("✅ 連結已成功複製！可以貼給學生了。");
    }

    // 3. 顯示歷史紀錄
    function renderHistory() {
        const historyDiv = document.getElementById('history-list');
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];

        if (history.length === 0) {
            historyDiv.innerHTML = '<p style="color:#7f8c8d;">尚未有歷史紀錄</p>';
            return;
        }

        historyDiv.innerHTML = '';
        // 反轉陣列，讓最新的在上面
        history.reverse().forEach(record => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <span>🕒 ${record.time} (共 ${record.data.length} 題)</span>
                <button class="btn btn-primary" style="padding: 5px 10px; font-size: 14px;" onclick="loadHistory('${record.id}')">載入此題庫</button>
            `;
            historyDiv.appendChild(item);
        });
    }

    // 將歷史記錄重新載入到編輯區
    function loadHistory(recordId) {
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        const record = history.find(h => h.id === recordId);
        if (record) {
            questions = record.data;
            renderQuestions();
            alert("✅ 題庫已成功載入！您可以繼續修改或直接生成連結。");
        }
    }

    // 4. 解析學生測驗畫面的資料
    function loadStudentQuiz(encodedData) {
        try {
            // 解碼 Base64 取得 JSON
            const jsonString = decodeURIComponent(escape(atob(decodeURIComponent(encodedData))));
            const studentQuestions = JSON.parse(jsonString);
            
            const container = document.getElementById('quiz-container');
            container.innerHTML = `<p>本測驗共有 ${studentQuestions.length} 題：</p>`;
            
            // 這裡可以接續您原本寫好的互動測驗邏輯
            studentQuestions.forEach((q, i) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-card';
                qDiv.innerHTML = `
                    <h4>Q${i+1}. ${q.question}</h4>
                    <p>A) ${q.options.A}</p>
                    <p>B) ${q.options.B}</p>
                    ${q.options.C ? `<p>C) ${q.options.C}</p>` : ''}
                    ${q.options.D ? `<p>D) ${q.options.D}</p>` : ''}
                `;
                container.appendChild(qDiv);
            });

        } catch (e) {
            document.getElementById('quiz-container').innerHTML = "<p style='color:red;'>⚠️ 連結無效或資料損毀，請確認網址是否完整。</p>";
        }
    }
</script>
