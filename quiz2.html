<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手動出MC題</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; color: white; width: 100%; font-size: 18px; margin-top: 10px; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 12px; }
        
        .question-card { background: #f9f9f9; padding: 15px; border-left: 5px solid #3498db; margin-bottom: 10px; border-radius: 4px; }
        .history-item { background: #ecf0f1; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        /* Modal 彈窗樣式 */
        #qr-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 1000; text-align: center; width: 90%; max-width: 400px; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        
        /* 學生測驗區塊隱藏 */
        #student-view { display: none; }
    </style>
</head>
<body>

<div class="container" id="teacher-view">
    <h1>🐼 智多星互動學習王 - 老師手動出題</h1>

    <div>
        <h2>📝 1. 新增題目</h2>
        <div class="form-group">
            <label>題目內容：</label>
            <textarea id="q-text" rows="3" placeholder="請輸入題目..."></textarea>
        </div>
        <div class="form-group">
            <label>選項 A：</label><input type="text" id="opt-a">
        </div>
        <div class="form-group">
            <label>選項 B：</label><input type="text" id="opt-b">
        </div>
        <div class="form-group">
            <label>選項 C：</label><input type="text" id="opt-c">
        </div>
        <div class="form-group">
            <label>選項 D：</label><input type="text" id="opt-d">
        </div>
        <div class="form-group">
            <label>正確答案：</label>
            <select id="correct-ans">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="addQuestion()">➕ 加入此題</button>
    </div>

    <div style="margin-top: 30px;">
        <h2>📋 2. 目前題庫清單 (共 <span id="q-count">0</span> 題)</h2>
        <div id="questions-list"></div>
        <button class="btn btn-success" onclick="generateShareLink()">🔗 儲存並生成學生連結 / QR Code</button>
    </div>

    <div style="margin-top: 30px;">
        <h2>📂 3. 題庫歷史 (儲存於本機)</h2>
        <div id="history-list"></div>
    </div>
</div>

<div class="container" id="student-view">
    <h1>🧠 挑戰小測試</h1>
    <div id="quiz-container"></div>
    </div>

<div id="overlay" onclick="closeModal()"></div>
<div id="qr-modal">
    <h3>📲 分享給學生</h3>
    <p>掃描 QR Code 或複製縮短的連結：</p>
    <div id="qrcode"></div>
    <input type="text" id="short-link" readonly style="width:100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
    <button class="btn btn-primary" onclick="copyLink()">複製連結</button>
    <button class="btn" style="background:#bdc3c7;" onclick="closeModal()">關閉</button>
</div>

<script>
    let questions = [];

    // 初始化：檢查是否為「學生測驗模式」（網址內有 ?data= 參數）
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');

        if (encodedData) {
            // 切換到學生畫面
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'block';
            loadStudentQuiz(encodedData);
        } else {
            // 老師出題畫面：載入歷史紀錄
            renderHistory();
        }
    }

    // 1. 新增題目到清單
    function addQuestion() {
        const qText = document.getElementById('q-text').value.trim();
        const optA = document.getElementById('opt-a').value.trim();
        const optB = document.getElementById('opt-b').value.trim();
        const optC = document.getElementById('opt-c').value.trim();
        const optD = document.getElementById('opt-d').value.trim();
        const correctAns = document.getElementById('correct-ans').value;

        if (!qText || !optA || !optB) {
            alert("請至少輸入題目及選項A、選項B！");
            return;
        }

        const questionObj = {
            id: Date.now(),
            question: qText,
            options: { A: optA, B: optB, C: optC, D: optD },
            answer: correctAns
        };

        questions.push(questionObj);
        renderQuestions();
        clearForm();
    }

    // 清空輸入表單
    function clearForm() {
        document.getElementById('q-text').value = '';
        document.getElementById('opt-a').value = '';
        document.getElementById('opt-b').value = '';
        document.getElementById('opt-c').value = '';
        document.getElementById('opt-d').value = '';
        document.getElementById('correct-ans').value = 'A';
    }

    // 渲染目前的題目清單
    function renderQuestions() {
        const listDiv = document.getElementById('questions-list');
        listDiv.innerHTML = '';
        document.getElementById('q-count').innerText = questions.length;

        questions.forEach((q, index) => {
            const div = document.createElement('div');
            div.className = 'question-card';
            div.innerHTML = `
                <strong>Q${index + 1}: ${q.question}</strong><br>
                A) ${q.options.A} | B) ${q.options.B} | C) ${q.options.C} | D) ${q.options.D}<br>
                <span style="color: #e74c3c; font-weight: bold;">解答：${q.answer}</span>
                <button class="btn-danger" style="float: right;" onclick="removeQuestion(${q.id})">刪除</button>
                <div style="clear: both;"></div>
            `;
            listDiv.appendChild(div);
        });
    }

    // 刪除題目
    function removeQuestion(id) {
        questions = questions.filter(q => q.id !== id);
        renderQuestions();
    }

    // 2. 儲存題庫、生成連結與縮網址
    async function generateShareLink() {
        if (questions.length === 0) {
            alert("請至少輸入一題題目後再生成連結！");
            return;
        }

        // 儲存到 localStorage 歷史紀錄
        const quizRecord = {
            id: 'quiz_' + Date.now(),
            time: new Date().toLocaleString(),
            data: questions
        };
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        history.push(quizRecord);
        localStorage.setItem('quizHistory', JSON.stringify(history));
        renderHistory();

        // 將題目資料轉為 Base64 (可放進網址內)
        const jsonData = JSON.stringify(questions);
        const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonData))));
        
        // 取得目前的網址路徑
        const baseUrl = window.location.origin + window.location.pathname;
        const longUrl = `${baseUrl}?data=${encodedData}`;

        showModal("縮網址生成中... ⏳");

        try {
            // 使用 TinyURL API 縮短連結 (避免 Base64 網址太長)
            const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
            if (response.ok) {
                const shortUrl = await response.text();
                document.getElementById('short-link').value = shortUrl;
                renderQRCode(shortUrl);
            } else {
                throw new Error("縮網址 API 錯誤");
            }
        } catch (error) {
            console.error(error);
            // 萬一縮網址失敗，就退回使用長網址
            document.getElementById('short-link').value = longUrl;
            renderQRCode(longUrl);
        }
    }

    // 生成 QR Code
    function renderQRCode(url) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = ''; 
        new QRCode(qrContainer, {
            text: url,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff"
        });
    }

    // 彈出視窗與複製連結
    function showModal(initialText) {
        document.getElementById('short-link').value = initialText || "";
        document.getElementById('overlay').style.display = 'block';
        document.getElementById('qr-modal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('qr-modal').style.display = 'none';
    }

    function copyLink() {
        const linkInput = document.getElementById('short-link');
        linkInput.select();
        document.execCommand("copy");
        alert("✅ 連結已成功複製！可以貼給學生了。");
    }

    // 3. 顯示歷史紀錄
    function renderHistory() {
        const historyDiv = document.getElementById('history-list');
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];

        if (history.length === 0) {
            historyDiv.innerHTML = '<p style="color:#7f8c8d;">尚未有歷史紀錄</p>';
            return;
        }

        historyDiv.innerHTML = '';
        // 反轉陣列，讓最新的在上面
        history.reverse().forEach(record => {
            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `
                <span>🕒 ${record.time} (共 ${record.data.length} 題)</span>
                <button class="btn btn-primary" style="padding: 5px 10px; font-size: 14px;" onclick="loadHistory('${record.id}')">載入此題庫</button>
            `;
            historyDiv.appendChild(item);
        });
    }

    // 將歷史記錄重新載入到編輯區
    function loadHistory(recordId) {
        let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
        const record = history.find(h => h.id === recordId);
        if (record) {
            questions = record.data;
            renderQuestions();
            alert("✅ 題庫已成功載入！您可以繼續修改或直接生成連結。");
        }
    }

    // 4. 解析學生測驗畫面的資料
    function loadStudentQuiz(encodedData) {
        try {
            // 解碼 Base64 取得 JSON
            const jsonString = decodeURIComponent(escape(atob(decodeURIComponent(encodedData))));
            const studentQuestions = JSON.parse(jsonString);
            
            const container = document.getElementById('quiz-container');
            container.innerHTML = `<p>本測驗共有 ${studentQuestions.length} 題：</p>`;
            
            // 這裡可以接續您原本寫好的互動測驗邏輯
            studentQuestions.forEach((q, i) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-card';
                qDiv.innerHTML = `
                    <h4>Q${i+1}. ${q.question}</h4>
                    <p>A) ${q.options.A}</p>
                    <p>B) ${q.options.B}</p>
                    ${q.options.C ? `<p>C) ${q.options.C}</p>` : ''}
                    ${q.options.D ? `<p>D) ${q.options.D}</p>` : ''}
                `;
                container.appendChild(qDiv);
            });

        } catch (e) {
            document.getElementById('quiz-container').innerHTML = "<p style='color:red;'>⚠️ 連結無效或資料損毀，請確認網址是否完整。</p>";
        }
    }
</script>
</body>
</html>
