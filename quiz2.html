<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學互動學習王 v7 (修復版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <div id="history-section" class="bg-white rounded-xl shadow-sm p-6 border border-gray-100">
            <div class="flex items-center space-x-2 text-xl font-bold text-gray-900 mb-2">
                <span>📂</span>
                <h2>題庫歷史</h2>
            </div>
            <p class="text-sm text-gray-500 mb-4">記錄存在本機瀏覽器</p>
            <div id="history-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <p class="text-gray-400 text-sm italic">暫無歷史紀錄</p>
            </div>
        </div>

        <div class="text-center py-4">
            <h1 class="text-3xl font-extrabold text-gray-900 flex items-center justify-center space-x-2">
                <span>🐼</span>
                <span>智多星互動學習王</span>
            </h1>
        </div>

        <div id="teacher-panel" class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 space-y-4">
            <div class="flex items-center space-x-2 text-lg font-bold text-gray-900 border-b pb-2">
                <span>📝</span>
                <h3>手動建立自定義題目</h3>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">題目問題</label>
                    <textarea id="q-text" rows="2" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="例如：下列哪一個是香港的特產？"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">選項 A</label>
                        <input type="text" id="opt-a" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="選項 A 內容">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">選項 B</label>
                        <input type="text" id="opt-b" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="選項 B 內容">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">選項 C</label>
                        <input type="text" id="opt-c" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="選項 C 內容">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">選項 D</label>
                        <input type="text" id="opt-d" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500" placeholder="選項 D 內容">
                    </div>
                </div>
                <div class="w-full sm:w-1/3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">設定正確答案</label>
                    <select id="correct-ans" class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-blue-500">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div class="pt-2">
                    <button onclick="addQuestion()" class="w-full bg-slate-800 text-white font-medium py-2.5 px-4 rounded-lg hover:bg-slate-700 transition duration-200 text-sm flex items-center justify-center space-x-1">
                        <span>➕</span> <span>加入目前題庫 (目前: <span id="q-count">0</span> 題)</span>
                    </button>
                </div>
            </div>

            <div id="preview-box" class="hidden border-t pt-4 mt-4">
                <p class="text-sm font-bold text-gray-700 mb-2">📋 本次新增題庫預覽：</p>
                <div id="preview-list" class="space-y-2 max-h-40 overflow-y-auto text-xs text-gray-600"></div>
            </div>
            
            <div class="border-t pt-4">
                <button onclick="generateShareLink()" class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-200 shadow-sm flex items-center justify-center space-x-2">
                    <span>🚀</span>
                    <span>生成學生連結 / QR Code</span>
                </button>
            </div>
        </div>

        <div id="quiz-section" class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 space-y-6">
            <div class="flex items-center justify-between border-b pb-4">
                <div class="flex items-center space-x-2 text-2xl font-bold text-gray-900">
                    <span>🧠</span>
                    <h2>挑戰小測試</h2>
                </div>
                <button onclick="resetQuiz()" class="inline-flex items-center space-x-1 bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium py-1.5 px-3 rounded-lg text-sm transition duration-150">
                    <span>🔄</span>
                    <span>重做一次</span>
                </button>
            </div>

            <div id="quiz-container" class="space-y-6 divide-y divide-gray-100">
                <p class="text-gray-400 text-center py-6 italic">等待載入題目或點擊歷史紀錄...</p>
            </div>

            <div id="student-share-action" class="hidden border-t pt-4 text-center">
                <button onclick="openModalDirectly()" class="text-sm font-medium text-blue-600 hover:text-blue-700 flex items-center justify-center mx-auto space-x-1">
                    <span>🔗</span> <span>再次查看此題庫的學生連結 / QR Code</span>
                </button>
            </div>
        </div>

    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity duration-200" onclick="closeModal()"></div>
    <div id="qr-modal" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90%] max-w-sm bg-white rounded-2xl shadow-xl p-6 z-50 hidden transition-transform duration-200 text-center">
        <h3 class="text-lg font-bold text-gray-900 flex items-center justify-center space-x-1">
            <span>📲</span>
            <span>分享給學生</span>
        </h3>
        <p class="text-xs text-gray-500 mt-1 mb-4">掃描 QR Code 或複製連結</p>
        
        <div id="qrcode" class="flex justify-center my-4 p-2 bg-gray-50 rounded-xl w-[190px] h-[190px] mx-auto items-center border border-gray-100"></div>
        
        <div class="mt-4 flex items-center space-x-2">
            <input type="text" id="short-link" readonly class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs text-gray-600 focus:outline-none" value="產生中...⏳">
            <button onclick="copyLink()" class="bg-blue-600 text-white text-xs font-semibold px-3 py-2 rounded-lg hover:bg-blue-700 whitespace-nowrap transition">
                複製
            </button>
        </div>

        <button onclick="closeModal()" class="w-full mt-5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium py-2 rounded-lg transition">
            關閉
        </button>
    </div>

    <script>
        let currentQuestions = [];
        let globalShortUrl = "";

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const encodedData = urlParams.get('data');

            if (encodedData) {
                // 【學生模式】：隱藏手動出題控制台，直接加載答題功能
                document.getElementById('teacher-panel').style.display = 'none';
                document.getElementById('history-section').style.display = 'none';
                loadQuizFromData(encodedData);
            } else {
                // 【老師出題模式】：加載歷史紀錄
                renderHistory();
            }
        }

        // 1. 手動加入題目至暫存陣列
        function addQuestion() {
            const text = document.getElementById('q-text').value.trim();
            const a = document.getElementById('opt-a').value.trim();
            const b = document.getElementById('opt-b').value.trim();
            const c = document.getElementById('opt-c').value.trim();
            const d = document.getElementById('opt-d').value.trim();
            const ans = document.getElementById('correct-ans').value;

            if (!text || !a || !b) {
                alert("請填寫題目問題，且至少需要輸入 A 和 B 兩個選項！");
                return;
            }

            const qObj = {
                question: text,
                options: { A: a, B: b, C: c, D: d },
                answer: ans
            };

            currentQuestions.push(qObj);
            document.getElementById('q-count').innerText = currentQuestions.length;
            
            // 更新預覽清單
            const previewBox = document.getElementById('preview-box');
            const previewList = document.getElementById('preview-list');
            previewBox.classList.remove('hidden');
            
            const pElem = document.createElement('div');
            pElem.className = "p-1.5 bg-gray-50 rounded border border-gray-100 flex justify-between items-center";
            pElem.innerHTML = `<span>Q${currentQuestions.length}: ${text.substring(0,15)}... (正確答案: ${ans})</span>`;
            previewList.appendChild(pElem);

            // 清空出題框
            document.getElementById('q-text').value = '';
            document.getElementById('opt-a').value = '';
            document.getElementById('opt-b').value = '';
            document.getElementById('opt-c').value = '';
            document.getElementById('opt-d').value = '';
            document.getElementById('correct-ans').value = 'A';
        }

        // 2. 儲存、生成學生連結與 QR Code（包含本地緩存歷史與 TinyURL 縮短連結）
        async function generateShareLink() {
            if (currentQuestions.length === 0) {
                alert("目前題庫空空如也，請先點擊上方「➕ 加入目前題庫」增加題目！");
                return;
            }

            // 本地儲存 (LocalStorage) 的歷史紀錄結構 (完全比照原版機制)
            const recordId = 'quiz_' + Date.now();
            const timestamp = new Date().toLocaleString('zh-TW', { hour12: false });
            const snapshotTitle = currentQuestions[0].question.substring(0, 12) + "...";
            const recordData = {
                id: recordId,
                time: timestamp,
                title: snapshotTitle,
                questions: currentQuestions
            };

            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history.push(recordData);
            localStorage.setItem('quizHistory', JSON.stringify(history));
            renderHistory();

            // 打包壓縮成 Base64
            const jsonStr = JSON.stringify(currentQuestions);
            const base64Data = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonStr))));
            const longUrl = `${window.location.origin}${window.location.pathname}?data=${base64Data}`;

            openModal("縮短網址生成中... ⏳");

            try {
                // 使用免費穩定的 TinyURL API 進行短網址縮短
                const res = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (res.ok) {
                    globalShortUrl = await res.text();
                    document.getElementById('short-link').value = globalShortUrl;
                    generateQRCode(globalShortUrl);
                } else {
                    throw new Error();
                }
            } catch (e) {
                // 如果縮網址接口異常，則退回使用完整長網址傳遞，確保系統 100% 可用
                globalShortUrl = longUrl;
                document.getElementById('short-link').value = globalShortUrl;
                generateQRCode(globalShortUrl);
            }

            // 同步在老師本地端將題目渲染至小測試區域，方便老師自己預覽測試
            renderQuizUI(currentQuestions);
            document.getElementById('student-share-action').classList.remove('hidden');
        }

        // 3. 🧠 渲染「挑戰小測試」互動式題目
        function renderQuizUI(questions) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            questions.forEach((q, qIdx) => {
                const qBlock = document.createElement('div');
                // 照抄原網頁的題目卡片邊距排版
                qBlock.className = "pt-6 first:pt-0 space-y-3";
                qBlock.innerHTML = `<h4 class="text-base font-bold text-gray-900"><span class="text-blue-600 mr-1">Q${qIdx + 1}.</span>${q.question}</h4>`;

                const optContainer = document.createElement('div');
                optContainer.className = "grid grid-cols-1 gap-2 sm:grid-cols-2";

                // 選項按鈕交互核心 (完美重現綠色正確/紅色錯誤效果)
                ['A', 'B', 'C', 'D'].forEach(key => {
                    const text = q.options[key];
                    if (text) {
                        const btn = document.createElement('button');
                        btn.className = `q-${qIdx}-btn w-full text-left px-4 py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-sm font-medium hover:bg-gray-100 hover:border-gray-200 transition duration-150 flex items-center space-x-2`;
                        btn.innerHTML = `<span class="bg-white border border-gray-200 shadow-sm w-6 h-6 rounded-md flex items-center justify-center text-xs text-gray-500 shrink-0 font-bold">${key}</span> <span class="text-gray-700">${text}</span>`;
                        
                        btn.onclick = function() {
                            // 凍結當前題目的所有選項點擊
                            document.querySelectorAll(`.q-${qIdx}-btn`).forEach(b => b.disabled = true);
                            
                            if (key === q.answer) {
                                // 答對了：綠色高亮
                                btn.classList.remove('border-gray-100', 'bg-gray-50');
                                btn.classList.add('border-green-500', 'bg-green-50', 'text-green-900');
                                btn.querySelector('span').classList.add('bg-green-500', 'text-white', 'border-green-500');
                            } else {
                                // 答錯了：當前選項變紅，並且強制將正確的選項亮綠色
                                btn.classList.remove('border-gray-100', 'bg-gray-50');
                                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-900');
                                btn.querySelector('span').classList.add('bg-red-500', 'text-white', 'border-red-500');

                                // 自動將正確答案亮綠色
                                document.querySelectorAll(`.q-${qIdx}-btn`).forEach(b => {
                                    if (b.innerHTML.includes(`font-bold">${q.answer}</span>`)) {
                                        b.classList.remove('border-gray-100', 'bg-gray-50');
                                        b.classList.add('border-green-500', 'bg-green-50');
                                        b.querySelector('span').classList.add('bg-green-500', 'text-white', 'border-green-500');
                                    }
                                });
                            }
                        };
                        optContainer.appendChild(btn);
                    }
                });

                qBlock.appendChild(optContainer);
                container.appendChild(qBlock);
            });
        }

        // 🔄 重做一次功能：完整還原測驗狀態，重置按鈕樣式
        function resetQuiz() {
            const activeQuestions = currentQuestions.length > 0 ? currentQuestions : null;
            if (activeQuestions) {
                renderQuizUI(activeQuestions);
            } else {
                alert("目前畫面上沒有進行中的測驗題目可以重做。");
            }
        }

        // 4. 解析學生網址鏈接參數
        function loadQuizFromData(encodedData) {
            try {
                const jsonStr = decodeURIComponent(escape(atob(decodeURIComponent(encodedData))));
                currentQuestions = JSON.parse(jsonStr);
                renderQuizUI(currentQuestions);
            } catch (e) {
                document.getElementById('quiz-container').innerHTML = `<p class="text-red-500 text-center py-6 font-medium">⚠️ 題目載入失敗，此網址可能已被截斷或不完整。</p>`;
            }
        }

        // 5. 渲染本機場景下的題庫歷史紀錄列表
        function renderHistory() {
            const historyList = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];

            if (history.length === 0) {
                historyList.innerHTML = `<p class="text-gray-400 text-sm italic">暫無歷史紀錄</p>`;
                return;
            }

            historyList.innerHTML = '';
            // 由新到舊反轉排序顯示
            history.reverse().forEach(item => {
                const row = document.createElement('div');
                // 完美複製原網頁灰色精巧條目樣式與懸停特效
                row.className = "flex items-center justify-between p-2.5 bg-gray-50 rounded-lg hover:bg-gray-100 transition text-sm text-gray-700";
                row.innerHTML = `
                    <div class="truncate mr-4">
                        <span class="font-medium text-gray-900">${item.time}</span> 
                        <span class="ml-2 text-gray-500 text-xs">[${item.questions.length} 題]</span>
                        <span class="ml-1 text-gray-400 italic text-xs">(${item.title})</span>
                    </div>
                    <div class="flex space-x-2 shrink-0">
                        <button onclick="loadHistoryItem('${item.id}')" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded font-medium hover:bg-blue-100 transition">載入</button>
                        <button onclick="deleteHistoryItem('${item.id}')" class="text-xs bg-red-50 text-red-600 px-2.5 py-1 rounded font-medium hover:bg-red-100 transition">刪除</button>
                    </div>
                `;
                historyList.appendChild(row);
            });
        }

        function loadHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            const target = history.find(item => item.id === id);
            if (target) {
                currentQuestions = target.questions;
                document.getElementById('q-count').innerText = currentQuestions.length;
                renderQuizUI(currentQuestions);
                
                // 動態恢復此歷史網址以利隨時再次分享
                const jsonStr = JSON.stringify(currentQuestions);
                const base64Data = encodeURIComponent(btoa(unescape(encodeURIComponent(jsonStr))));
                globalShortUrl = `${window.location.origin}${window.location.pathname}?data=${base64Data}`;
                document.getElementById('student-share-action').classList.remove('hidden');
                
                alert("✅ 題庫已成功恢復！已同步加載至下方「挑戰小測試」中。");
            }
        }

        function deleteHistoryItem(id) {
            if (!confirm("確定要刪除這筆歷史題庫紀錄嗎？")) return;
            let history = JSON.parse(localStorage.getItem('quizHistory')) || [];
            history = history.filter(item => item.id !== id);
            localStorage.setItem('quizHistory', JSON.stringify(history));
            renderHistory();
        }

        // 6. QR Code 與彈跳視窗視圖控制器
        function generateQRCode(text) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            new QRCode(container, {
                text: text,
                width: 170,
                height: 170,
                colorDark : "#0f172a",
                colorLight : "#f8fafc"
            });
        }

        function openModal(loadingText) {
            if(loadingText) document.getElementById('short-link').value = loadingText;
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('qr-modal').classList.remove('hidden');
        }

        function openModalDirectly() {
            openModal(globalShortUrl);
            generateQRCode(globalShortUrl);
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('qr-modal').classList.add('hidden');
        }

        function copyLink() {
            const linkInput = document.getElementById('short-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999);
            document.execCommand("copy");
            alert("✅ 學生連結已成功複製到剪貼簿！");
        }
    </script>
</body>
</html>
